<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="resAIDserch: an autonomous literature scout and shared memory for engineering teams." />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231c1b18'/%3E%3Crect x='6' y='16.5' width='20' height='8.5' rx='2' fill='%23e8a838' transform='rotate(-4 16 21)'/%3E%3Ctext x='16' y='24.5' text-anchor='middle' font-family='Georgia,Times,serif' font-size='23' font-weight='700' fill='white'%3Er%3C/text%3E%3C/svg%3E"
    />
    <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)" />
    <title>resAIDserch · Literature Scout</title>
    <script>
      try {
        var t = localStorage.getItem('hs-theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {
        /* storage blocked: fall back to the OS theme via CSS */
      }
    </script>
  </head>
  <body>
    <!-- Boot screen: plain HTML/CSS so it paints before the JS bundle and fonts download. React replaces it on mount. -->
    <style>
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: #f6f5f1; color: #1c1b18; font: 13px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      .boot-word { font: 600 32px/1 'Source Serif 4 Variable', Georgia, 'Times New Roman', serif; letter-spacing: -0.025em; }
      .boot-word b { position: relative; z-index: 0; margin: 0 0.04em; padding: 0 0.05em; font-weight: 700; }
      .boot-word b::before { content: ''; position: absolute; z-index: -1; left: -0.07em; right: -0.09em; top: 0.42em; bottom: -0.04em;
        border-radius: 0.08em 0.22em 0.1em 0.26em; background: #f4c75a; transform: rotate(-2deg) skewX(-10deg); }
      .boot-ring { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #d6d2c9; border-top-color: #1c1b18; animation: boot-spin 0.8s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) .boot { background: #121211; color: #edebe6; }
        :root:not([data-theme='light']) .boot-word b::before { background: rgba(236, 170, 52, 0.78); }
        :root:not([data-theme='light']) .boot-ring { border-color: #393935; border-top-color: #edebe6; } }
      :root[data-theme='dark'] .boot { background: #121211; color: #edebe6; }
      :root[data-theme='dark'] .boot-word b::before { background: rgba(236, 170, 52, 0.78); }
      :root[data-theme='dark'] .boot-ring { border-color: #393935; border-top-color: #edebe6; }
      @media (prefers-reduced-motion: reduce) { .boot-ring { animation-duration: 2.4s; } }
    </style>
    <div id="root"><div class="boot" role="status" aria-label="Loading resAIDserch"><span class="boot-word">res<b>AID</b>serch</span><div class="boot-ring"></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
