<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="resAIDserch: an autonomous literature scout and shared memory for engineering teams." />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314594c'/%3E%3Cpath d='M9 10.5h14M9 16h14M9 21.5h7' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3Ccircle cx='21.5' cy='21.5' r='2.7' fill='%23e8a838'/%3E%3C/svg%3E"
    />
    <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)"
    />
    <title>resAIDserch · Literature Scout</title>
    <script>
      try {
        var t = localStorage.getItem('hs-theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {
        /* storage blocked: fall back to the OS theme via CSS */
      }
    </script>
  </head>
  <body>
    <!-- Boot screen: plain HTML/CSS so it paints before the JS bundle and fonts download. React replaces it on mount. -->
    <style>
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        background: #f6f5f1; color: #4a4740; font: 500 14px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      .boot-ring { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #d6d2c9; border-top-color: #14594c; animation: boot-spin 0.8s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) .boot { background: #121211; color: #b6b3ab; }
        :root:not([data-theme='light']) .boot-ring { border-color: #393935; border-top-color: #79cdb6; } }
      :root[data-theme='dark'] .boot { background: #121211; color: #b6b3ab; }
      :root[data-theme='dark'] .boot-ring { border-color: #393935; border-top-color: #79cdb6; }
      @media (prefers-reduced-motion: reduce) { .boot-ring { animation-duration: 2.4s; } }
    </style>
    <div id="root"><div class="boot" role="status"><div class="boot-ring"></div><span>Loading resAIDserch…</span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
