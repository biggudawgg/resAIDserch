# Cloud Build pipeline: build the backend image and deploy it to Cloud Run.
# Triggered by pushes to master on github.com/biggudawgg/resAIDerch.
steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/resaiderch-backend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/resaiderch-backend:latest'
      - '.'
    dir: 'backend'

  # Step 2: Push the image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', 'gcr.io/$PROJECT_ID/resaiderch-backend']

  # Step 3: Deploy to Cloud Run
  # Quick-deploy config: in-memory state, private service (grant allUsers invoker manually to expose it).
  # For persistence, add Direct VPC egress (--network/--subnet/--vpc-egress=private-ranges-only) and
  # --update-secrets=HINDSIGHT_DATABASE_URL=lit-scout-db-url:latest (see infrastructure/alloydb-setup.sh).
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'lit-scout-backend'
      - '--image=gcr.io/$PROJECT_ID/resaiderch-backend:$COMMIT_SHA'
      - '--platform=managed'
      - '--region=us-central1'
      - '--port=8000'
      - '--no-allow-unauthenticated'
      - '--cpu=2'
      - '--memory=2Gi'
      - '--timeout=900'
      # State is held in-process, so exactly one always-on instance.
      - '--min-instances=1'
      - '--max-instances=1'
      - '--no-cpu-throttling'
      - '--set-env-vars=ENVIRONMENT=production'

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '1800s'
