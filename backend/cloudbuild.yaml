steps:
  # Step 1: Install dependencies and run tests
  - name: 'python:3.11'
    entrypoint: pip
    args: ['install', '-r', 'requirements.txt']
    dir: 'backend'

  # Step 2: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/lit-scout-backend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/lit-scout-backend:latest'
      - '.'
    dir: 'backend'

  # Step 3: Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/lit-scout-backend:$COMMIT_SHA'

  # Step 4: Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gke-deploy'
    args:
      - run
      - '--filename=.'
      - '--image=gcr.io/$PROJECT_ID/lit-scout-backend:$COMMIT_SHA'
      - '--location=us-central1'
      - '--output=/workspace/output'

  # Step 5: Deploy to Cloud Run using gcloud
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'lit-scout-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/lit-scout-backend:$COMMIT_SHA'
      - '--platform'
      - 'managed'
      - '--region'
      - 'us-central1'
      - '--allow-unauthenticated'
      - '--cpu'
      - '2'
      - '--memory'
      - '2Gi'
      - '--timeout'
      - '900'
      - '--update-env-vars'
      - 'ENVIRONMENT=production'
      - '--set-cloudsql-instances'
      - '${PROJECT_ID}:us-central1:lit-scout-db'

images:
  - 'gcr.io/$PROJECT_ID/lit-scout-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/lit-scout-backend:latest'

timeout: '1800s'
