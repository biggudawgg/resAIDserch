# Cloud Build pipeline: build the backend image and deploy it to Cloud Run.
# Triggered by pushes to master on github.com/biggudawgg/resAIDerch.
steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/resaiderch-backend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/resaiderch-backend:latest'
      - '.'
    dir: 'backend'

  # Step 2: Push the image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', 'gcr.io/$PROJECT_ID/resaiderch-backend']

  # Step 3: Deploy to Cloud Run
  # Database is AlloyDB (private IP), reached through Direct VPC egress; created by infrastructure/alloydb-setup.sh.
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'lit-scout-backend'
      - '--image=gcr.io/$PROJECT_ID/resaiderch-backend:$COMMIT_SHA'
      - '--platform=managed'
      - '--region=us-central1'
      - '--port=8000'
      - '--allow-unauthenticated'
      - '--cpu=2'
      - '--memory=2Gi'
      - '--timeout=900'
      # State is held in-process and snapshotted to the database, so exactly one always-on instance.
      - '--network=lit-scout-network'
      - '--subnet=lit-scout-subnet'
      - '--vpc-egress=private-ranges-only'
      - '--min-instances=1'
      - '--max-instances=1'
      - '--no-cpu-throttling'
      - '--set-env-vars=ENVIRONMENT=production'
      - '--update-secrets=HINDSIGHT_DATABASE_URL=lit-scout-db-url:latest,GROQ_API_KEY=lit-scout-groq-key:latest,OPENAI_API_KEY=lit-scout-openai-key:latest'

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '1800s'
